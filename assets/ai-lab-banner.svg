<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#081423"/>
      <stop offset="0.5" stop-color="#0C1E35"/>
      <stop offset="1" stop-color="#07111E"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CF3FF"/>
      <stop offset="1" stop-color="#2EC5FF"/>
    </linearGradient>
    <linearGradient id="violetGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 160) rotate(90) scale(220 480)">
      <stop offset="0" stop-color="#1B2A44" stop-opacity="1"/>
      <stop offset="1" stop-color="#091827" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 700 46px 'Segoe UI', Arial, sans-serif; letter-spacing: 5px; fill: #EAFBFF; }
      .subtitle { font: 600 18px 'Segoe UI', Arial, sans-serif; letter-spacing: 8px; fill: #A9D8FF; }
      .node { fill: #0F2037; stroke: url(#cyanGlow); stroke-width: 2; }
      .node.violet { stroke: url(#violetGlow); }
      .pulse { animation: pulse 2.8s ease-in-out infinite alternate; transform-origin: center; transform-box: fill-box; }
      .float { animation: float 6s ease-in-out infinite alternate; }
      .drift { animation: drift 8s ease-in-out infinite alternate; }
      .dash { stroke-dasharray: 8 14; animation: dashMove 7s linear infinite; }
      @keyframes pulse {
        0% { opacity: 0.45; transform: scale(0.96); }
        100% { opacity: 1; transform: scale(1.08); }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
      @keyframes drift {
        0% { transform: translateX(0px); }
        100% { transform: translateX(16px); }
      }
      @keyframes dashMove {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -120; }
      }
    </style>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <circle cx="600" cy="200" r="260" fill="url(#orb)"/>

  <!-- Background matrix dots -->
  <g opacity="0.6">
    <circle cx="100" cy="70" r="2.2" fill="#7CF3FF"/>
    <circle cx="180" cy="120" r="2.2" fill="#7CF3FF"/>
    <circle cx="760" cy="90" r="2.2" fill="#7CF3FF"/>
    <circle cx="1020" cy="80" r="2.2" fill="#7CF3FF"/>
    <circle cx="1100" cy="240" r="2.2" fill="#C084FC"/>
    <circle cx="170" cy="310" r="2.2" fill="#2EC5FF"/>
    <circle cx="980" cy="320" r="2.2" fill="#7CF3FF"/>
    <circle cx="870" cy="250" r="2.2" fill="#C084FC"/>
  </g>

  <!-- Neural network connections -->
  <g opacity="0.9" stroke-linecap="round" stroke-linejoin="round">
    <path class="dash" d="M120 140 L260 185 L290 115 L430 170 L510 100 L650 152 L760 120 L900 200 L1020 170" stroke="url(#cyanGlow)" stroke-width="2.5"/>
    <path class="dash" d="M130 260 L270 210 L360 255 L470 210 L610 290 L760 230 L910 260 L1010 220" stroke="url(#violetGlow)" stroke-width="2.5"/>
    <path class="dash" d="M220 90 L310 150 L410 70 L570 165 L690 70 L830 170 L960 100" stroke="#2EC5FF" stroke-opacity="0.6" stroke-width="1.8"/>
    <path class="dash" d="M220 300 L360 260 L500 300 L640 220 L790 300 L960 260" stroke="#8B5CF6" stroke-opacity="0.7" stroke-width="1.8"/>
  </g>

  <!-- Nodes -->
  <g>
    <g class="pulse">
      <circle class="node" cx="120" cy="140" r="12"/>
      <circle class="node violet" cx="260" cy="185" r="10"/>
      <circle class="node" cx="290" cy="115" r="10"/>
      <circle class="node violet" cx="430" cy="170" r="11"/>
      <circle class="node" cx="510" cy="100" r="12"/>
      <circle class="node violet" cx="650" cy="152" r="12"/>
      <circle class="node" cx="760" cy="120" r="11"/>
      <circle class="node violet" cx="900" cy="200" r="12"/>
      <circle class="node" cx="1020" cy="170" r="12"/>
    </g>

    <g class="float">
      <circle class="node" cx="130" cy="260" r="11"/>
      <circle class="node violet" cx="270" cy="210" r="10"/>
      <circle class="node" cx="360" cy="255" r="11"/>
      <circle class="node violet" cx="470" cy="210" r="11"/>
      <circle class="node" cx="610" cy="290" r="12"/>
      <circle class="node violet" cx="760" cy="230" r="11"/>
      <circle class="node" cx="910" cy="260" r="11"/>
      <circle class="node violet" cx="1010" cy="220" r="12"/>
    </g>
  </g>

  <!-- Center glow and circuit arcs -->
  <g class="drift" opacity="0.9">
    <circle cx="600" cy="200" r="82" stroke="url(#cyanGlow)" stroke-opacity="0.8" stroke-width="2.5" fill="none"/>
    <circle cx="600" cy="200" r="120" stroke="url(#violetGlow)" stroke-opacity="0.7" stroke-width="1.8" fill="none"/>
    <path d="M520 120 C560 90, 640 90, 680 120" stroke="url(#cyanGlow)" stroke-width="2" fill="none"/>
    <path d="M510 280 C560 320, 640 320, 690 280" stroke="url(#violetGlow)" stroke-width="2" fill="none"/>
  </g>

  <!-- Text -->
  <g>
    <text x="600" y="185" text-anchor="middle" class="title">AI &amp; ML LEARNING LAB</text>
    <text x="600" y="225" text-anchor="middle" class="subtitle">BUILD • EXPERIMENT • LEARN • DEPLOY</text>
  </g>

  <!-- Signal bars -->
  <g opacity="0.75">
    <rect x="440" y="252" width="320" height="4" rx="2" fill="url(#cyanGlow)"/>
    <rect x="470" y="270" width="260" height="4" rx="2" fill="url(#violetGlow)"/>
  </g>
</svg>
